<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Draco.AI - Premium AI Assistant</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>

<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <i class="fas fa-dragon"></i> Draco.AI
                </div>
                <!-- Close btn for mobile -->
                <button class="mobile-menu-btn" onclick="toggleSidebar()" style="font-size: 1rem;">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <button class="new-chat-btn" onclick="startNewChat()">
                <i class="fas fa-plus"></i> New Chat
            </button>

            <div class="chat-list" id="chatList">
                <!-- Chat items here -->
            </div>
        </aside>

        <!-- Main Content -->
        <main class="chat-main">
            <!-- Header -->
            <header class="chat-header">
                <div style="display: flex; align-items: center; gap: 1rem;">
                    <button class="mobile-menu-btn" onclick="toggleSidebar()">
                        <i class="fas fa-bars"></i>
                    </button>
                    <div class="model-selector-container">
                        <select class="model-select" id="modelSelect">
                            <!-- Options populated by JS -->
                        </select>
                    </div>
                </div>

                <!-- Status/Settings could go here -->
                <div class="model-status" style="display: none;"> <!-- Hidden for cleaner look, relying on dropdown -->
                    <span class="status-indicator status-ready"></span>
                </div>
            </header>

            <!-- Messages -->
            <div class="messages-container" id="messagesContainer">
                <div class="welcome-screen" id="welcomeScreen">
                    <div class="welcome-icon">🐉</div>
                    <h1 class="welcome-title">Draco.AI</h1>
                    <p class="welcome-subtitle">Premium. Instant. Free.</p>

                    <div class="feature-grid">
                        <div class="feature-card">
                            <i class="fas fa-bolt feature-icon"></i>
                            <div class="feature-title">Instant</div>
                            <div class="feature-description">No downloads required</div>
                        </div>
                        <div class="feature-card">
                            <i class="fas fa-layer-group feature-icon"></i>
                            <div class="feature-title">8+ Models</div>
                            <div class="feature-description">GPT-4o, Claude, Llama 3</div>
                        </div>
                        <div class="feature-card">
                            <i class="fas fa-shield-alt feature-icon"></i>
                            <div class="feature-title">Private</div>
                            <div class="feature-description">Your data is safe</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Input Area -->
            <div class="input-area">
                <div class="input-container">
                    <textarea class="message-input" id="messageInput" placeholder="Message Draco..."
                        rows="1"></textarea>
                    <button class="send-btn" id="sendButton" disabled>
                        <i class="fas fa-arrow-up"></i>
                    </button>
                </div>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="app.js"></script>
</body>

</html>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="app.js"></script>
</body>

</html>
